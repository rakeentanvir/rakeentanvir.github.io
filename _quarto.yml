project:
  type: website
  output-dir: _site
  # Only these pages are rendered; the other Markdown files (docs/, _pages/, the briefs) are not pages.
  render:
    - index.qmd
    - research.qmd
    - cv.qmd
    - 404.qmd
  # CNAME is copied unchanged into _site so the custom domain survives each gh-pages deploy.
  resources:
    - CNAME
  post-render:
    # Puts the CV PDF at files/CV_RakeenTanvir.pdf (see the script for why).
    - _scripts/copy-cv-pdf.ts
    # Lets the old-URL redirect pages work without JavaScript.
    - _scripts/alias-redirects.ts

website:
  title: "Rakeen Tanvir"
  description: &site-description "Rakeen Tanvir is a PhD student in the Strategy Department at Duke University's Fuqua School of Business, researching innovation and entrepreneurship strategy."
  # The one place the domain is set (the CV PDF header reuses it via cv-site-url below).
  site-url: &site-url https://rakeentanvir.com
  favicon: images/favicon.ico
  # The link-preview image (og:image, twitter:image) for every page. At 100x128 px it is smaller
  # than most previews accept (Facebook 200x200, X/Twitter 144x144), so previews show text only
  # until a larger photo replaces it (docs/design-brief.md, open item 2).
  image: images/profile.jpg
  open-graph: true
  # X/Twitter card tags. The summary card, not summary_large_image: that one needs a 300x157 px
  # or larger image.
  twitter-card:
    card-style: summary
  search: false
  navbar:
    collapse: false
    # Always visible; the default hides the bar on scroll with a slide animation.
    pinned: true
    right:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: CV
        href: cv.qmd

# website.* is not visible to the meta shortcode, so expose the same URL to cv.qmd.
cv-site-url: *site-url

# Page metadata every page inherits (a page's own front matter overrides it).
# description gives each page its <meta name="description"> and its og:/twitter: description;
# without a page-level description Quarto emits no meta description at all, and research.html
# got no og:description either. hide-description keeps it out of the title block, where Quarto
# would otherwise print it under the page title.
# TODO: page-specific descriptions, if wanted (research.qmd, cv.qmd): add `description:` to the
# page's front matter. Until then every page carries the site description above.
description: *site-description
hide-description: true
# Alt text for the preview image (og:image:alt, twitter:image:alt): the headshot's alt text.
image-alt: "Portrait of Rakeen Tanvir"

# Design variant (typography and spacing): styles-a.scss reads docs/design-brief.md literally,
# styles-b.scss is a second reading. Change this one line to switch. The variant goes after
# styles.scss below: Quarto reads a later theme file's defaults first, so its tokens are defined
# before styles.scss uses them.
design-variant: &design-variant styles-a.scss

format:
  html:
    theme:
      light: [default, styles.scss, *design-variant]
      dark: [default, styles.scss, *design-variant, styles-dark.scss]
    respect-user-color-scheme: true
    toc: false
    anchor-sections: false
    smooth-scroll: false
    canonical-url: true
    # Listing pages otherwise pull MathJax from a CDN; the site has no math.
    html-math-method: plain
