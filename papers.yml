- section: working-papers
  title: "\"The Cost of Flexibility: Informal Governance and Resilience in the South African Taxi Industry.\""
  authors: "Christopher F. Eaglin and Rakeen Tanvir."
  venue: "Revise and resubmit at the *Strategic Management Journal*, 2026."
  description: "We study how the management of informal institutions shapes small-firm performance in South Africa's minibus taxi industry. Using administrative loan records, high-frequency GPS data, and weather shocks, we find that organizational flexibility increases vehicle utilization and improves loan repayment, though it does not fully protect firms when severe shocks occur."
