# data are unchanged; "examine" is from the co-author's abstract (chriseaglin.com/research).
- section: working-papers
  title: "\"The Cost of Flexibility: Informal Governance and Resilience in the Minibus Taxi Industry in South Africa.\""
  authors: "Christopher F. Eaglin and Rakeen Tanvir."
  venue: "Revise and resubmit at the *Strategic Management Journal*, 2026."
  description: "We study how the management of informal institutions shapes small-firm performance in South Africa's minibus taxi industry. Using administrative loan records, high-frequency GPS data, and weather shocks, we examine how organizational flexibility shapes vehicle utilization and loan repayment, including when severe shocks occur."

