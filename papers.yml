- section: publications
  title: "\"Hawkish or Dovish? Inferring Intended Monetary Policy from the Fed's Dot Plot.\""
  href: https://www.sciencedirect.com/science/article/abs/pii/S0165188926000400
  authors: "Manuel González-Astudillo and Rakeen Tanvir."
  venue: "*Journal of Economic Dynamics and Control*, 2026."
  description: "Using the median projections in the Federal Reserve's Summary of Economic Projections from 2012 to 2025, we estimate a forward-guidance Taylor rule with time-varying coefficients. After the pandemic, the Fed's intended policy became more persistent and markedly more responsive to inflation, while its responsiveness to the output gap stayed stable. The estimated rule also helps explain bond excess returns, which indicates that markets read the evolving rule in the dot plot."
  finding: "We find that after the pandemic the Fed's intended policy became more persistent and markedly more responsive to inflation, while its responsiveness to the output gap stayed stable."
  links:
    - text: SSRN working paper
      href: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5047330

